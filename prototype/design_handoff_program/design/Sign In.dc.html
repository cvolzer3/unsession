<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta charset="utf-8">
<title>Program — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#f4f4f6;color:#16171d;font-family:'Space Grotesk',sans-serif;}
  a{color:#4c5fd5;text-decoration:none;} a:hover{color:#3a4ab8;text-decoration:underline;}
  *{box-sizing:border-box;} input,button{font-family:inherit;}
</style>
</helmet>
<div style="min-height:100vh;display:grid;place-items:center;padding:32px 20px;">
  <div style="width:400px;max-width:100%;">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:26px;justify-content:center;">
      <div style="width:30px;height:30px;background:#4c5fd5;color:#fff;display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;">P</div>
      <div style="font-weight:700;font-size:19px;letter-spacing:-0.01em;">Program</div>
    </div>
    <div style="background:#fff;border:1px solid #e2e3e8;padding:28px;">
      <div style="font-size:18px;font-weight:700;letter-spacing:-0.01em;margin-bottom:2px;">Sign in</div>
      <div style="font-size:13px;color:#686b74;margin-bottom:20px;">Organizer workspace · devconf.org</div>
      <div style="display:flex;flex-direction:column;gap:12px;">
        <label style="display:block;">
          <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;color:#9a9da6;margin-bottom:5px;">EMAIL</div>
          <input value="{{ email }}" onChange="{{ setEmail }}" style="width:100%;padding:9px 11px;border:1px solid #d4d5db;font-size:13.5px;background:#fff;">
        </label>
        <label style="display:block;">
          <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;color:#9a9da6;margin-bottom:5px;">PASSWORD</div>
          <input type="password" value="{{ pw }}" onChange="{{ setPw }}" style="width:100%;padding:9px 11px;border:1px solid #d4d5db;font-size:13.5px;background:#fff;">
        </label>
        <a href="Dashboard.dc.html" style="display:block;text-align:center;padding:11px;background:#4c5fd5;color:#fff;font-size:14px;font-weight:600;text-decoration:none;" style-hover="background:#3a4ab8;color:#fff;text-decoration:none;">Sign in</a>
        <div style="text-align:center;font-size:12px;"><a href="#">Email me a magic link instead</a></div>
      </div>
    </div>
    <div style="margin-top:22px;">
      <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.14em;color:#9a9da6;margin-bottom:8px;text-align:center;">DEMO — OPEN A SEEDED SESSION</div>
      <div style="background:#fff;border:1px solid #e2e3e8;display:flex;flex-direction:column;">
        <a href="Dashboard.dc.html" style="display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid #eceded;color:#16171d;text-decoration:none;" style-hover="background:#f7f8fc;text-decoration:none;color:#16171d;">
          <span style="width:26px;height:26px;border-radius:50%;background:#4c5fd5;color:#fff;display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;flex:none;">MK</span>
          <span style="font-size:13.5px;font-weight:600;">Marta Keller</span>
          <span style="margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#9a9da6;">ORGANIZER →</span>
        </a>
        <a href="Evaluator Workspace.dc.html" style="display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid #eceded;color:#16171d;text-decoration:none;" style-hover="background:#f7f8fc;text-decoration:none;color:#16171d;">
          <span style="width:26px;height:26px;border-radius:50%;background:#e8590c;color:#fff;display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;flex:none;">DA</span>
          <span style="font-size:13.5px;font-weight:600;">Deniz Aksoy</span>
          <span style="margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#9a9da6;">EVALUATOR →</span>
        </a>
        <a href="Speaker Portal.dc.html" style="display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid #eceded;color:#16171d;text-decoration:none;" style-hover="background:#f7f8fc;text-decoration:none;color:#16171d;">
          <span style="width:26px;height:26px;border-radius:50%;background:#1c7ed6;color:#fff;display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;flex:none;">SR</span>
          <span style="font-size:13.5px;font-weight:600;">Sofia Rossi</span>
          <span style="margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#9a9da6;">SPEAKER →</span>
        </a>
        <a href="Agenda.dc.html" style="display:flex;align-items:center;gap:10px;padding:11px 16px;color:#16171d;text-decoration:none;" style-hover="background:#f7f8fc;text-decoration:none;color:#16171d;">
          <span style="width:26px;height:26px;border-radius:50%;background:#1a1a2e;color:#fff;display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;flex:none;">DC</span>
          <span style="font-size:13.5px;font-weight:600;">DevConf 2027 — public site</span>
          <span style="margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#9a9da6;">ATTENDEE →</span>
        </a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { email: 'marta@devconf.org', pw: 'devconf2027' };
  renderVals() {
    return {
      email: this.state.email, pw: this.state.pw,
      setEmail: (e) => this.setState({ email: e.target.value }),
      setPw: (e) => this.setState({ pw: e.target.value })
    };
  }
}
</script>
</body>
</html>
