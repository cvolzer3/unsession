<!doctype html>
<!-- Source for public/og.png (1200×630). Regenerate with scripts/make-og-image.sh
     after editing. Visual language mirrors the landing page: paper + dot grid,
     Space Grotesk headline with the amber highlighter, indigo logo mark. -->
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16171d; --ink2:#555a63;
    --paper:#faf8f5; --line:#ece7de;
    --indigo:#4c5fd5; --amber:#ffd43b;
    --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{width:1200px;height:630px;overflow:hidden;font-family:'Space Grotesk',sans-serif;color:var(--ink);
    background:
      radial-gradient(ellipse 760px 400px at 88% -12%, rgba(76,95,213,0.12), transparent 62%),
      radial-gradient(circle at 1px 1px, #e4ded2 1px, transparent 0);
    background-color:var(--paper);
    background-size:auto, 26px 26px;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:64px 72px 56px;}
  .brand-logo{display:block;width:286px;height:auto;}
  .kicker{font-family:var(--mono);font-size:17px;letter-spacing:0.16em;color:var(--indigo);font-weight:600;margin-bottom:22px;}
  h1{font-size:88px;line-height:1.04;letter-spacing:-0.035em;font-weight:700;max-width:17ch;}
  h1 em{font-style:normal;position:relative;white-space:nowrap;}
  h1 em::after{content:"";position:absolute;left:-3px;right:-3px;bottom:14px;height:0.34em;background:var(--amber);z-index:-1;}
  .foot{display:flex;align-items:center;justify-content:space-between;}
  .chips{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:15px;letter-spacing:0.06em;color:var(--ink2);}
  .chips span{background:#fff;border:1px solid var(--line);padding:8px 13px;font-weight:500;}
  .chips i{font-style:normal;color:var(--indigo);}
  .url{font-family:var(--mono);font-size:18px;font-weight:600;color:var(--indigo);}
</style>
</head>
<body>
  <img class="brand-logo" src="../public/brand/unsession-logo.svg" alt="unsession">
  <div>
    <div class="kicker">FOR CONFERENCE ORGANIZERS &amp; PROGRAM TEAMS</div>
    <h1>From open call to <em>opening keynote</em></h1>
  </div>
  <div class="foot">
    <div class="chips">
      <span>Proposals</span><i>→</i><span>Reviews</span><i>→</i><span>Decisions</span><i>→</i><span>Speakers</span><i>→</i><span>Agenda</span>
    </div>
    <div class="url">unsession.dev</div>
  </div>
</body>
</html>
